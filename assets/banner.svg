<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.07" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.08" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtitle Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes pingDot {
        0% { r: 3px; opacity: 1; }
        50% { r: 7px; opacity: 0.4; }
        100% { r: 3px; opacity: 1; }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }

      .pulse-cyan {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 150px;
      }
      .pulse-purple {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 1000px 220px;
      }
      .pulse-pink {
        animation: pulseGlow 7s ease-in-out 1s infinite alternate;
        transform-origin: 600px 350px;
      }
      .float-1 {
        animation: floatSlow1 5s ease-in-out infinite;
      }
      .float-2 {
        animation: floatSlow2 6.5s ease-in-out infinite;
      }
      .float-3 {
        animation: floatSlow3 4.5s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 8s linear infinite;
      }
      .flow-line-fast {
        stroke-dasharray: 6 5;
        animation: dashFlow 4s linear infinite;
      }
      .ping-point {
        animation: pingDot 3s ease-in-out infinite;
      }
      .shimmer-badge {
        animation: shimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />
  <rect width="1196" height="416" x="2" y="2" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Animated Glow Nebulas -->
  <g id="ambient-glows">
    <circle cx="220" cy="120" r="140" fill="#0284c7" filter="url(#glowCyan)" class="pulse-cyan" />
    <circle cx="980" cy="180" r="160" fill="#7c3aed" filter="url(#glowPurple)" class="pulse-purple" />
    <circle cx="600" cy="360" r="130" fill="#db2777" filter="url(#glowPink)" class="pulse-pink" />
  </g>

  <!-- Technical Grid Matrix -->
  <g opacity="0.18">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#38bdf8" stroke-width="0.5" />

    <line x1="150" y1="0" x2="150" y2="420" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="300" y1="0" x2="300" y2="420" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="450" y1="0" x2="450" y2="420" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="600" y1="0" x2="600" y2="420" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="750" y1="0" x2="750" y2="420" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="900" y1="0" x2="900" y2="420" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke="#38bdf8" stroke-width="0.5" />
  </g>

  <!-- Dynamic Neural Interconnect Circuit Lines -->
  <g id="synaptic-flows" opacity="0.65">
    <!-- Top Left to Center Arc -->
    <path d="M 80,60 Q 220,90 320,50 T 520,70" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <!-- Center to Right Arc -->
    <path d="M 680,70 Q 820,40 940,80 T 1120,60" fill="none" stroke="#c084fc" stroke-width="1.5" class="flow-line-fast" />
    <!-- Bottom Swirl Line -->
    <path d="M 70,360 C 260,340 400,390 600,365 C 800,340 960,380 1130,350" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
    <!-- Vertical Cross Synapses -->
    <path d="M 160,110 L 160,320" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <path d="M 1040,110 L 1040,320" fill="none" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
  </g>

  <!-- Floating Modality Dynamic Badges (Positioned in Corners & Flanks to prevent overlapping text) -->
  <!-- Modality 1: Vision (Top Left Flank) -->
  <g class="float-1" transform="translate(60, 95)">
    <rect width="155" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" class="ping-point" />
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">👁️ Vision &amp; OCR</text>
  </g>

  <!-- Modality 2: Video (Bottom Left Flank) -->
  <g class="float-2" transform="translate(55, 275)">
    <rect width="160" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="20" cy="19" r="6" fill="#ec4899" class="ping-point" />
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">🎬 Video Dynamics</text>
  </g>

  <!-- Modality 3: Speech / Audio (Top Right Flank) -->
  <g class="float-2" transform="translate(980, 95)">
    <rect width="165" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="20" cy="19" r="6" fill="#a855f7" class="ping-point" />
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">🗣️ Speech &amp; Audio</text>
  </g>

  <!-- Modality 4: Robotics VLA (Bottom Right Flank) -->
  <g class="float-1" transform="translate(975, 275)">
    <rect width="170" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="19" r="6" fill="#10b981" class="ping-point" />
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">🦾 Embodied VLA</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Guaranteed Unobscured) ================= -->
  <g id="hero-foreground" filter="url(#textShadow)">
    <!-- Top Pill: Category Identifier -->
    <g transform="translate(460, 48)">
      <rect width="280" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.9" stroke="url(#cardBorderGrad)" stroke-width="1.2" />
      <text x="140" y="19" text-anchor="middle" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM 2026 ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      AWESOME MULTIMODAL AI
    </text>

    <!-- Title Sub-Header -->
    <text x="600" y="195" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0.8">
      Top Foundation Models, VLMs &amp; Any-to-Any Systems
    </text>

    <!-- Description / Tagline -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
      Vision-Language Reasoning • Native Audio/Speech • GUI Computer-Use Agents • Edge Inference
    </text>

    <!-- Bottom Feature Chips / Metrics Bar -->
    <g transform="translate(230, 290)">
      <!-- Chip 1: Open Weights -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1" />
        <text x="82.5" y="21" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🚀 Open-Source Weights</text>
      </g>

      <!-- Chip 2: Enterprise APIs -->
      <g transform="translate(190, 0)">
        <rect width="170" height="34" rx="17" fill="#0f172a" fill-opacity="0.95" stroke="#818cf8" stroke-width="1" />
        <text x="85" y="21" text-anchor="middle" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🏢 Frontier SaaS &amp; APIs</text>
      </g>

      <!-- Chip 3: Edge & Mobile -->
      <g transform="translate(385, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" fill-opacity="0.95" stroke="#c084fc" stroke-width="1" />
        <text x="82.5" y="21" text-anchor="middle" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📱 Edge &amp; Mobile Ready</text>
      </g>

      <!-- Chip 4: Benchmarked -->
      <g transform="translate(575, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" fill-opacity="0.95" stroke="#34d399" stroke-width="1" />
        <text x="82.5" y="21" text-anchor="middle" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📊 Star &amp; Eval Metrics</text>
      </g>
    </g>
  </g>
</svg>
